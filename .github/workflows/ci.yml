name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GUI crate (eframe + rfd) needs GTK/XKB dev libraries to compile.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

      - name: Route example boards (DRC must be clean)
        run: |
          for b in demo local12x12 stress8x8 stress6x6; do
            ./target/release/autoroute examples/$b.dsn --check 2>&1 | tee /tmp/out.txt
            grep -q "DRC: clean" /tmp/out.txt
            grep -q "0 failed nets, 0 conflicted nets" /tmp/out.txt
          done
