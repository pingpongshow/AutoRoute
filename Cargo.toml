[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/dsn",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

# Fast-ish debug builds for the GUI
[profile.dev.package."*"]
opt-level = 2
